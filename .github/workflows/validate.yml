name: validate
on:
  push:
  pull_request:

jobs:
  validate-skills:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell syntax
        run: |
          for f in scripts/install.sh scripts/detect-commands.sh scripts/test-detect-commands.sh scripts/smoke-test.sh scripts/validate.sh; do
            bash -n "$f"
          done

      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh scripts/detect-commands.sh scripts/test-detect-commands.sh scripts/smoke-test.sh scripts/validate.sh

      - name: Node syntax
        run: node --check scripts/zentao-users.mjs

      - name: Node helper syntax
        run: |
          node --check scripts/find-fixed-unresolved.mjs
          node --check scripts/test-find-fixed-unresolved.mjs
          node --check scripts/test-zentao-users.mjs

      - name: Helper tests
        run: |
          node --test scripts/test-find-fixed-unresolved.mjs
          node --test scripts/test-zentao-users.mjs

      - name: Validate SKILL.md and docs
        run: bash scripts/validate.sh

      - name: Command detection tests
        run: bash scripts/test-detect-commands.sh

      - name: Install smoke test
        run: bash scripts/smoke-test.sh
