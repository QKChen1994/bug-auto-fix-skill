name: validate
on:
  push:
  pull_request:

jobs:
  validate-skills:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell syntax
        run: |
          for f in scripts/install.sh scripts/validate.sh; do
            bash -n "$f"
          done

      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh scripts/validate.sh

      - name: Node syntax
        run: |
          for f in scripts/*.mjs; do
            node --check "$f"
          done

      - name: Tests
        run: |
          node --test scripts/test-install.mjs scripts/test-detect-commands.mjs \
                     scripts/test-zentao-users.mjs scripts/test-zentao-remark.mjs \
                     scripts/test-find-fixed-unresolved.mjs

      - name: Validate SKILL.md and docs
        run: bash scripts/validate.sh
